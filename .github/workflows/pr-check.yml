name: Pull Request Build Check

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build --platform linux/amd64 -f Dockerfile --tag gomtech-bff-pr-check:latest --load .